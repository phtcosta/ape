# Hand-written, NOT generated (rearch-02-runspec task 6.2).
#
# A MOP arm carrying ape.mopWeightActivity, retired when the jar deleted Config.mopWeightActivity
# (component triggering + mopWeightOpenMenu replaced it). The harness still maps the key for
# backward compatibility with pre-mop-fairtest configs, so a hand-edited or archived experiment
# config can still emit it — which is precisely why the jar must reject it loudly instead of
# ignoring it. An ignored scoring weight is the gh71 failure mode: a knob that reads as set and
# fires zero times.
#
# Expected outcome: abort with reason=retired_key key=ape.mopWeightActivity, before step 1.
